# Render Blueprint for the desk.
#
# WHY THIS EXISTS
#
# The desk has been deployed on Vercel since it was built. That account is on the free `hobby`
# plan, and on 9 September every deployment started coming back BLOCKED before a build even
# started — no build logs on any of them, which is what said it was the account rather than the
# code. Unpausing the project was accepted by the API and did not hold. Hobby is also
# non-commercial only, and this is client work.
#
# So this is the alternative host, committed rather than described, so moving is a decision
# somebody makes in one click rather than a piece of work.
#
# WHAT IT DOES NOT DO
#
# Nothing here moves anything on its own. Render reads this when a Blueprint is created against
# the repository, and the environment variables below are deliberately `sync: false` — Render
# prompts for each one rather than this file carrying a value. No key belongs in version control,
# and the anon key least of all people expect to be the one that leaks.
#
# TWO THINGS BREAK IF YOU MOVE AND FORGET THEM
#
#   1. NEXT_PUBLIC_SITE_URL feeds the magic-link redirect in app/app/login/page.tsx. Point it at
#      the new host or sign-in sends people to a URL that no longer serves the app.
#   2. Supabase Auth keeps an allow-list of redirect URLs. The new origin has to be added there,
#      or the link in the email is refused at the last step — which looks like a broken login
#      rather than a missing setting.
#
# Both are one-line changes and neither announces itself.

services:
  - type: web
    name: the-desk
    runtime: node
    plan: free
    region: singapore

    # The Next app is not at the repository root — the root holds the migrations, the workers and
    # the MCP server, none of which this service needs.
    rootDir: app

    buildCommand: npm ci && npm run build
    startCommand: npm run start

    # Next.js binds to $PORT, which Render sets. `next start` respects it without configuration.
    healthCheckPath: /login

    envVars:
      # Prompted on first deploy. None of these is written here.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

      # The magic-link redirect target. Set it to this service's own URL once Render has assigned
      # one — it is not knowable before the first deploy, which is why it is prompted rather than
      # derived.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

      # Who may sign in. It is currently "*" by an explicit decision, which means ANYONE who
      # reaches the URL can sign in with any address and read the whole idea bank. Carried across
      # deliberately rather than silently: a new host is a good moment to reconsider it, and a
      # good moment to not have it change without anyone noticing.
      - key: ALLOWED_EMAIL
        sync: false

      - key: NODE_VERSION
        value: "22"
