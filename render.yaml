# Render Blueprint for the desk.
#
# WHY THIS EXISTS
#
# It was written on 9 September as an escape from Vercel, on a diagnosis that turned out to be
# wrong. Every deployment that day came back BLOCKED with no build logs, and the account is on the
# free `hobby` plan, so the plan looked like the cause. It was not.
#
# What the deployment list actually showed, once it was read rather than skimmed: every BLOCKED
# deployment carried `githubDeployment: "1"`, and every READY one did not. The Vercel project
# `the-desk` had `link: null` — it was never connected to a repository. Something was firing GitHub
# deployments at a project with no git link, and Vercel refused them before a build. A one-file probe
# deployed to the same account and returned READY, which is what ruled the account out.
#
# The fix was to link the repository properly. That project is `voice-to-content`, and its first
# build went green in 47 seconds.
#
# So this file is no longer the plan. It is kept because it still works, and because a host with one
# committed blueprint is a decision somebody makes in one click rather than a piece of work.
#
# WHAT IT DOES NOT DO
#
# Nothing here moves anything on its own. Render reads this when a Blueprint is created against the
# repository, and the environment variables below are deliberately `sync: false` — Render prompts for
# each one rather than this file carrying a value. No key belongs in version control, and the anon key
# least of all people expect to be the one that leaks.
#
# TWO THINGS BREAK IF YOU MOVE AND FORGET THEM
#
#   1. NEXT_PUBLIC_SITE_URL feeds the magic-link redirect in app/app/login/page.tsx. Point it at
#      the new host or sign-in sends people to a URL that no longer serves the app.
#   2. Supabase Auth keeps an allow-list of redirect URLs. The new origin has to be added there,
#      or the link in the email is refused at the last step — which looks like a broken login
#      rather than a missing setting.
#
# Both are one-line changes and neither announces itself. Both were needed on the Vercel move too.

services:
  - type: web
    name: the-desk
    runtime: node
    plan: free
    region: singapore

    # The Next app is not at the repository root — the root holds the migrations, the workers and
    # the MCP server, none of which this service needs.
    rootDir: app

    buildCommand: npm ci && npm run build
    startCommand: npm run start

    # Next.js binds to $PORT, which Render sets. `next start` respects it without configuration.
    healthCheckPath: /login

    envVars:
      # Prompted on first deploy. None of these is written here.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

      # The magic-link redirect target. Set it to this service's own URL once Render has assigned
      # one — it is not knowable before the first deploy, which is why it is prompted rather than
      # derived.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

      # Who may sign in. It is currently "*" by an explicit decision, which means ANYONE who
      # reaches the URL can sign in with any address and read the whole idea bank. Carried across
      # deliberately rather than silently: a new host is a good moment to reconsider it, and a
      # good moment to not have it change without anyone noticing.
      - key: ALLOWED_EMAIL
        sync: false

      - key: NODE_VERSION
        value: "22"
