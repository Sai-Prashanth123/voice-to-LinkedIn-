# Supabase project configuration.
#
# `verify_jwt` is declared here for every function, deliberately, because it is sticky: passing
# `--no-verify-jwt` once on the command line sets it on the deployed function and a later deploy
# WITHOUT the flag does not put it back. That is how `worker-dispatch` ended up publicly callable —
# one flag on one early deploy, invisible thereafter.
#
# Declaring it in the repo means the setting is reviewed like code, and a redeploy cannot quietly
# drift from it.
#
# Three functions are reachable without a JWT, and each authenticates itself:
#   transcript-webhook — the call recorder sends a shared secret in a header or query string
#   mcp                — clients send Authorization: Bearer <mcp token>, checked in auth.mjs
#   linkedin-oauth     — LinkedIn redirects a browser here with a code and a state we signed
#
# Everything else is invoked by pg_cron with the service_role key and must stay closed.

project_id = "uzqvebxcxgmseqjhfpku"

# The MCP endpoint carries its OWN auth: clients send `Authorization: Bearer <mcp token>`, and
# Supabase's JWT check would reject exactly the header the protocol uses.
#
# Pinned here rather than passed as --no-verify-jwt on the command line, because a bulk
# `supabase functions deploy` with no flag would otherwise silently close this door and every
# remote client would start getting 401s with nothing in the repository explaining why.
#
# It is not an open door. auth.mjs compares a bearer token in constant time and refuses everything
# when no token is configured — 12 tests cover that, including the fail-closed case.
[functions.mcp]
verify_jwt = false

[functions.transcript-webhook]
verify_jwt = false

# Written down rather than left to the default, because a deploy that forgot the flag once already
# turned this off. cc-submit is the write door to the idea bank: it applies extractions, records
# interview answers and creates moments. It must never be reachable without a project key.
[functions.cc-submit]
verify_jwt = true

[functions.worker-dispatch]
verify_jwt = true

[functions.worker-select]
verify_jwt = true

[functions.worker-triage]
verify_jwt = true

[functions.worker-publish]
verify_jwt = true

[functions.worker-metrics]
verify_jwt = true

[functions.worker-learn]
verify_jwt = true

[functions.worker-ops]
verify_jwt = true

# LinkedIn redirects a BROWSER here, so it cannot carry a Supabase JWT. It validates the signed
# state parameter it issued instead. Declared because this was previously only a --no-verify-jwt
# flag on a deploy command: sticky, therefore working, and one bulk deploy away from a 401 that
# nothing would explain.
[functions.linkedin-oauth]
verify_jwt = false
